<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f3eee6" />
    <title>Connections</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,620;1,9..144,480&family=Outfit:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <script src="../js/guard.js" data-gate="../index.html"></script>
  </head>
  <body class="page">
    <header class="top">
      <a class="mark" href="../anniversary.html">Year one</a>
      <a class="text-button" href="../anniversary.html">Back</a>
    </header>
    <main class="connect">
      <p class="eyebrow">Game</p>
      <h1>Connections</h1>
      <p class="connect-lede">Group the words into four sets of four.</p>
      <p class="connect-message" id="connect-message" role="status"></p>
      <div id="connect-solved" class="connect-solved"></div>
      <div id="connect-grid" class="connect-grid"></div>
      <p class="connect-lives">
        <span>Mistakes remaining</span>
        <span id="connect-dots" class="connect-dots"></span>
      </p>
      <div class="connect-actions" id="connect-actions">
        <button type="button" id="connect-shuffle">Shuffle</button>
        <button type="button" id="connect-clear">Deselect</button>
        <button type="button" id="connect-submit">Submit</button>
      </div>
      <button type="button" id="connect-again" hidden>Play again</button>
    </main>
    <!-- Groups live in js/connections.js. Replace the four sample sets there. -->
    <script src="../js/connections.js"></script>
  </body>
</html>
