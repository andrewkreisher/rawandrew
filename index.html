<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#14110f" />
    <title>Before you come in</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,620;1,9..144,480&family=Outfit:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="gate">
    <main class="gate-card">
      <div class="seal" aria-hidden="true"></div>
      <p class="eyebrow">Before you come in</p>
      <!-- Replace the sentence below with your riddle. -->
      <h1 id="riddle">Replace this line with the riddle. Only one answer opens the door.</h1>
      <form id="gate-form">
        <label class="answer-label" for="answer">Answer</label>
        <input
          id="answer"
          name="answer"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          enterkeyhint="go"
          required
        />
        <button type="submit">Enter</button>
        <p class="feedback" id="feedback" role="alert" hidden></p>
      </form>
      <a class="continue-link" data-continue href="anniversary.html" hidden>Continue inside</a>
    </main>
    <noscript>
      <p class="noscript">This door needs JavaScript to open.</p>
    </noscript>
    <script src="js/gate.js"></script>
  </body>
</html>
